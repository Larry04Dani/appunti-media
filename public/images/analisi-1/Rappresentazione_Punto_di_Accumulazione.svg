<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" class="w-full h-auto">
  <defs>
    <style>
      .txt { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Asse Reale Principale (R) -->
  <line x1="30" y1="85" x2="635" y2="85" stroke="currentColor" stroke-width="2" />
  <!-- Freccia Asse R -->
  <polygon points="648,85 634,80 637,85 634,90" fill="currentColor" />
  <text x="658" y="89" fill="currentColor" class="txt" font-weight="bold" font-size="16">ℝ</text>

  <!-- Insieme A visualizzato sull'asse (segmento colorato dal tema) -->
  <line x1="130" y1="85" x2="480" y2="85" stroke="var(--primary)" stroke-width="6" stroke-linecap="round" />
  <!-- Delimitatore sinistro dell'insieme A (incluso, parentesi quadra [ ) -->
  <path d="M 136 72 L 130 72 L 130 98 L 136 98" stroke="var(--primary)" stroke-width="2.5" fill="none" />
  <!-- Etichetta Insieme A -->
  <text x="145" y="62" fill="var(--primary)" class="txt" font-weight="bold" font-size="13">Insieme A</text>

  <!-- ─── 1. INTORNO DI x0 (Punto interno ad A) ─── -->
  <!-- Area ombreggiata dell'intorno I(x0, eps) -->
  <rect x="200" y="68" width="120" height="34" rx="6" fill="var(--primary)" fill-opacity="0.15" stroke="var(--primary)" stroke-width="0" stroke-dasharray="3,3" />
  <!-- Parentesi tonda aperta ( a x0 - eps -->
  <path d="M 205 72 Q 198 85 205 98" stroke="var(--primary)" stroke-width="2" fill="none" />
  <!-- Parentesi tonda chiusa ) a x0 + eps -->
  <path d="M 315 72 Q 322 85 315 98" stroke="var(--primary)" stroke-width="2" fill="none" />
  
  <!-- Punto x0 (Pieno, x0 appartiene ad A) -->
  <circle cx="260" cy="85" r="5" fill="currentColor" stroke="var(--background)" stroke-width="1.5" />
  <!-- Etichette x0 -->
  <text x="260" y="48" fill="currentColor" class="txt" font-weight="bold" font-size="14" text-anchor="middle">x₀ ∈ A</text>
  <text x="260" y="122" fill="currentColor" class="txt" font-weight="medium" font-size="12" text-anchor="middle">I(x₀, ε)</text>

  <!-- ─── 2. INTORNO DI x1 (Punto di accumulazione sul bordo/esterno ad A) ─── -->
  <!-- Area ombreggiata dell'intorno I(x1, eps) -->
  <rect x="420" y="68" width="120" height="34" rx="6" fill="var(--primary)" fill-opacity="0.15" stroke="var(--primary)" stroke-width="0" stroke-dasharray="3,3" />
  <!-- Parentesi tonda aperta ( a x1 - eps -->
  <path d="M 425 72 Q 418 85 425 98" stroke="var(--primary)" stroke-width="2" fill="none" />
  <!-- Parentesi tonda chiusa ) a x1 + eps -->
  <path d="M 535 72 Q 542 85 535 98" stroke="var(--primary)" stroke-width="2" fill="none" />
  
  <!-- Punto x1 (Vuoto, x1 NON appartiene ad A) -->
  <circle cx="480" cy="85" r="5" fill="var(--background)" stroke="currentColor" stroke-width="2.5" />
  <!-- Etichette x1 -->
  <text x="480" y="48" fill="currentColor" class="txt" font-weight="bold" font-size="14" text-anchor="middle">x₁ ∉ A</text>
  <text x="480" y="122" fill="currentColor" class="txt" font-weight="medium" font-size="12" text-anchor="middle">I(x₁, ε)</text>

  <!-- Spiegazione didattica in calce -->
  <text x="340" y="152" fill="currentColor" opacity="0.65" class="txt" font-size="11" text-anchor="middle">
    Entrambi gli intorni intersecano l'insieme A in infiniti punti
  </text>
</svg>
